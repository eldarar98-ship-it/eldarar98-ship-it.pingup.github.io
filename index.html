<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PingUp Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d27;
      --bg-tertiary: #242836;
      --bg-hover: #2a2f3e;
      --accent: #6c5ce7;
      --accent-hover: #7c6ff7;
      --accent-light: rgba(108, 92, 231, 0.15);
      --text-primary: #e8e8ed;
      --text-secondary: #9ca3b4;
      --text-muted: #636a7e;
      --border: #2a2f3e;
      --danger: #e74c3c;
      --danger-hover: #c0392b;
      --success: #2ecc71;
      --warning: #f39c12;
      --verified: #3498db;
      --online: #2ecc71;
      --message-own: #6c5ce7;
      --message-other: #242836;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* Плавные переходы */
    .fade-in { animation: fadeIn 0.3s ease; }
    .slide-up { animation: slideUp 0.3s ease; }
    .scale-in { animation: scaleIn 0.2s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    /* Верификация */
    .verified-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      background: var(--verified);
      border-radius: 50%;
      margin-left: 4px;
      font-size: 10px;
      color: #fff;
    }

    .verified-badge-lg { width: 20px; height: 20px; font-size: 12px; }
    .verified-text { font-size: 11px; color: var(--verified); margin-top: 2px; }

    /* Онлайн статус */
    .online-indicator {
      width: 10px;
      height: 10px;
      background: var(--online);
      border-radius: 50%;
      border: 2px solid var(--bg-secondary);
      position: absolute;
      bottom: 0;
      right: 0;
    }

    .online-indicator.offline { background: var(--text-muted); }

    /* Непрочитанное */
    .unread-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    /* Экраны */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg-primary);
      position: relative;
    }

    #login-screen::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(108,92,231,0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px;
      text-align: center;
      width: 440px;
      max-width: 90vw;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
      animation: scaleIn 0.3s ease;
    }

    .login-logo { font-size: 48px; margin-bottom: 8px; }

    .login-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), #a29bfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-subtitle { color: var(--text-secondary); font-size: 15px; margin-bottom: 32px; }

    .banned-screen { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg-primary); }

    .banned-card {
      background: var(--bg-secondary);
      border: 1px solid var(--danger);
      border-radius: var(--radius-lg);
      padding: 48px;
      text-align: center;
      max-width: 400px;
    }

    .banned-icon { font-size: 64px; margin-bottom: 16px; }
    .banned-title { font-size: 24px; font-weight: 700; color: var(--danger); margin-bottom: 12px; }
    .banned-text { color: var(--text-secondary); margin-bottom: 24px; }

    /* Кнопки */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(108,92,231,0.4); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-ghost { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-hover); }
    .btn-sm { padding: 6px 14px; font-size: 12px; }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all var(--transition);
    }

    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .form-error { font-size: 12px; color: var(--danger); margin-top: 4px; min-height: 18px; }

    /* Главный экран */
    #app-screen { display: flex; height: 100vh; }

    .sidebar {
      width: 360px;
      min-width: 360px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: transform var(--transition);
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-brand { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .sidebar-brand span { background: linear-gradient(135deg, var(--accent), #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .user-menu { display: flex; align-items: center; gap: 8px; }

    .user-avatar-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      overflow: hidden;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      transition: all var(--transition);
      position: relative;
    }

    .user-avatar-btn:hover { border-color: var(--accent); transform: scale(1.05); }
    .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

    .btn-icon {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      font-size: 16px;
    }

    .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); transform: scale(1.05); }

    .sidebar-search { padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .search-wrapper { position: relative; }
    .search-wrapper svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); }

    .search-input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all var(--transition);
    }

    .search-input:focus { border-color: var(--accent); }

    .sidebar-actions { padding: 8px 20px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
    .sidebar-actions .btn { flex: 1; padding: 8px; font-size: 12px; }

    .search-results { padding: 8px 12px; border-bottom: 1px solid var(--border); max-height: 240px; overflow-y: auto; }
    .search-results-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; padding: 4px 8px 8px; }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
    }

    .search-result-item:hover { background: var(--bg-hover); transform: translateX(4px); }

    .search-result-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      overflow: hidden;
      position: relative;
    }

    .search-result-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .search-result-info { flex: 1; min-width: 0; }
    .search-result-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; }
    .search-result-username { font-size: 12px; color: var(--text-muted); }

    .chat-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .chat-list::-webkit-scrollbar { width: 4px; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }

    .chat-list-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); }
    .chat-list-empty-icon { font-size: 48px; margin-bottom: 12px; }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .chat-item:hover { background: var(--bg-hover); transform: translateX(4px); }
    .chat-item.active { background: var(--accent-light); }

    .chat-item-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .chat-item-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .chat-item-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 10px;
      background: var(--bg-secondary);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-item-content { flex: 1; min-width: 0; }
    .chat-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
    .chat-item-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .chat-item-time { font-size: 11px; color: var(--text-muted); }
    .chat-item-footer { display: flex; align-items: center; justify-content: space-between; }
    .chat-item-last-msg { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    .chat-item-actions {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .chat-item:hover .chat-item-actions { opacity: 1; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); min-width: 0; }

    .chat-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100%;
      color: var(--text-muted);
      gap: 12px;
    }

    .chat-placeholder-icon { font-size: 64px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .chat-placeholder h3 { font-size: 20px; color: var(--text-secondary); }

    .chat-header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-secondary);
    }

    .chat-header-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: all var(--transition);
    }

    .chat-header-avatar:hover { transform: scale(1.05); }
    .chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-header-info { flex: 1; min-width: 0; cursor: pointer; }
    .chat-header-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .chat-header-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .chat-header-status.online { color: var(--online); }
    .chat-header-actions { display: flex; gap: 6px; }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 65%;
      animation: slideUp 0.3s ease;
      position: relative;
    }

    .message.own { align-self: flex-end; }
    .message.other { align-self: flex-start; }

    .message-sender {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
      padding: 0 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .message-sender:hover { text-decoration: underline; }

    .message-bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
      transition: all var(--transition);
    }

    .message.own .message-bubble { background: var(--message-own); color: #fff; border-bottom-right-radius: 4px; }
    .message.other .message-bubble { background: var(--message-other); color: var(--text-primary); border-bottom-left-radius: 4px; }

    .message-bubble:hover { transform: scale(1.01); }

    .message-footer { display: flex; align-items: center; gap: 6px; margin-top: 2px; padding: 0 4px; }
    .message-time { font-size: 10px; color: var(--text-muted); }
    .message-status { font-size: 10px; color: var(--text-muted); }
    .message-status.read { color: var(--accent); }
    .message.own .message-footer { justify-content: flex-end; }
    .message-edited { font-size: 10px; color: var(--text-muted); font-style: italic; }

    .message-actions {
      position: absolute;
      top: 0;
      right: -30px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .message:hover .message-actions { opacity: 1; }
    .message.own .message-actions { right: auto; left: -30px; }

    .message-action-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      border: none;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .message-action-btn:hover { background: var(--bg-hover); transform: scale(1.1); }

    .message-image { max-width: 280px; max-height: 300px; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); }
    .message-image:hover { transform: scale(1.02); }

    .message-sticker { width: 150px; height: 150px; object-fit: contain; cursor: pointer; }

    .message-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: all var(--transition);
    }

    .message-file:hover { background: rgba(0,0,0,0.3); }
    .message-file-icon { font-size: 24px; }
    .message-file-info { flex: 1; min-width: 0; }
    .message-file-name { font-size: 13px; font-weight: 500; }
    .message-file-size { font-size: 11px; opacity: 0.7; }

    .message-voice { display: flex; align-items: center; gap: 10px; min-width: 200px; }

    .voice-play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: inherit;
      transition: all var(--transition);
    }

    .voice-play-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }

    .voice-waveform { flex: 1; height: 30px; background: rgba(255,255,255,0.1); border-radius: 4px; position: relative; overflow: hidden; }
    .voice-progress { position: absolute; left: 0; top: 0; height: 100%; background: rgba(255,255,255,0.3); width: 0%; transition: width 0.1s linear; }
    .voice-duration { font-size: 11px; opacity: 0.7; min-width: 35px; text-align: right; }

    .message-input-bar { padding: 16px 24px; border-top: 1px solid var(--border); background: var(--bg-secondary); }
    .message-input-wrapper { display: flex; gap: 10px; align-items: flex-end; }
    .input-actions { display: flex; gap: 4px; }
    .input-actions .btn-icon { width: 44px; height: 44px; border-radius: var(--radius); }

    .message-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 44px;
      transition: all var(--transition);
    }

    .message-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    .message-input:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-send {
      width: 44px;
      height: 44px;
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .btn-send:hover { background: var(--accent-hover); transform: scale(1.05); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-send svg { width: 20px; height: 20px; }

    .btn-voice.recording { background: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .input-blocked-msg { text-align: center; padding: 14px; color: var(--text-muted); font-size: 13px; background: var(--bg-secondary); border-top: 1px solid var(--border); }

    .attachments-preview { display: flex; gap: 8px; padding: 8px 0; flex-wrap: wrap; }

    .attachment-item {
      position: relative;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: scaleIn 0.2s ease;
    }

    .attachment-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }

    .attachment-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--danger);
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: all var(--transition);
    }

    .attachment-remove:hover { transform: scale(1.1); }

    /* Стикеры */
    .sticker-panel {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      max-height: 350px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease;
    }

    .sticker-panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sticker-panel-title { font-size: 14px; font-weight: 600; }

    .sticker-tabs {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .sticker-tab {
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: all var(--transition);
    }

    .sticker-tab.active { background: var(--accent); color: #fff; }
    .sticker-tab:hover { background: var(--bg-hover); }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 16px;
      overflow-y: auto;
      max-height: 250px;
    }

    .sticker-item {
      aspect-ratio: 1;
      cursor: pointer;
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: all var(--transition);
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sticker-item:hover { transform: scale(1.1); background: var(--bg-hover); }
    .sticker-item img { width: 100%; height: 100%; object-fit: contain; }

    /* Избранное */
    .favorites-panel {
      padding: 16px;
    }

    .favorite-item {
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all var(--transition);
    }

    .favorite-item:hover { background: var(--bg-hover); }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 440px;
      max-width: 90vw;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      animation: scaleIn 0.3s ease;
    }

    .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }

    /* Профиль */
    .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: all var(--transition);
    }

    .profile-avatar:hover { transform: scale(1.05); }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .profile-avatar-edit {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      padding: 6px;
      font-size: 11px;
      text-align: center;
      color: #fff;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .profile-avatar:hover .profile-avatar-edit { opacity: 1; }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .profile-username { font-size: 14px; color: var(--text-muted); margin-bottom: 4px; }
    .profile-online { font-size: 12px; color: var(--online); margin-bottom: 8px; }
    .profile-bio { font-size: 14px; color: var(--text-secondary); text-align: center; margin-bottom: 16px; }

    .profile-stats { display: flex; gap: 24px; margin-bottom: 16px; }
    .profile-stat { text-align: center; cursor: pointer; transition: all var(--transition); }
    .profile-stat:hover { transform: scale(1.05); }
    .profile-stat:hover .profile-stat-value { color: var(--accent); }
    .profile-stat-value { font-size: 18px; font-weight: 700; transition: color var(--transition); }
    .profile-stat-label { font-size: 12px; color: var(--text-muted); }

    .profile-actions { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }
    .profile-actions .btn { flex: 1; min-width: 100px; }

    /* Настройки */
    .settings-section { margin-bottom: 24px; }
    .settings-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 12px; }

    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all var(--transition);
    }

    .settings-item:hover { background: var(--bg-hover); transform: translateX(4px); }
    .settings-item-label { font-size: 14px; }
    .settings-item-value { font-size: 13px; color: var(--text-muted); }

    .settings-divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 16px 0;
      cursor: pointer;
      transition: all var(--transition);
    }

    .settings-divider:hover { background: linear-gradient(90deg, transparent, var(--accent), transparent); }

    /* Списки */
    .member-list { max-height: 200px; overflow-y: auto; margin-top: 12px; }

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }

    .member-item:hover { background: var(--bg-hover); }
    .member-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }

    .member-info-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      overflow: hidden;
      position: relative;
    }

    .member-info-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .member-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .member-role { font-size: 11px; color: var(--accent); }
    .member-actions { display: flex; gap: 4px; }

    .modal::-webkit-scrollbar, .member-list::-webkit-scrollbar { width: 4px; }
    .modal::-webkit-scrollbar-thumb, .member-list::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }

    /* Тосты */
    .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; }

    .toast {
      padding: 12px 20px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 13px;
      box-shadow: var(--shadow);
      animation: slideUp 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
      max-width: 320px;
    }

    .toast.error { border-left: 3px solid var(--danger); }
    .toast.success { border-left: 3px solid var(--success); }

    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    .image-viewer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      cursor: zoom-out;
      animation: fadeIn 0.2s ease;
    }

    .image-viewer img { max-width: 90%; max-height: 90%; object-fit: contain; animation: scaleIn 0.3s ease; }

    .image-viewer-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      transition: all var(--transition);
    }

    .image-viewer-close:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }

    /* Адаптивность */
    @media (max-width: 768px) {
      .sidebar { width: 100%; min-width: 100%; position: absolute; z-index: 100; }
      .sidebar.sidebar-hidden { transform: translateX(-100%); }
      .chat-header .btn-back-mobile { display: flex !important; }
      .message { max-width: 85%; }
      .message-actions { display: none; }
    }

    @media (min-width: 769px) {
      .btn-back-mobile { display: none !important; }
    }

    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 16px; }
    .loading-screen .spinner { width: 40px; height: 40px; }

    .file-input-hidden { display: none; }

    /* Контекстное меню */
    .context-menu {
      position: fixed;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 0;
      min-width: 160px;
      box-shadow: var(--shadow);
      z-index: 1000;
      animation: scaleIn 0.15s ease;
    }

    .context-menu-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all var(--transition);
    }

    .context-menu-item:hover { background: var(--bg-hover); }
    .context-menu-item.danger { color: var(--danger); }

    /* Аккаунты */
    .accounts-list { margin-top: 16px; }
    .account-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .account-item:hover { background: var(--bg-hover); }
    .account-item.active { border: 2px solid var(--accent); }
    .account-avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: var(--accent-light); display: flex; align-items: center; justify-content: center; }
    .account-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .account-info { flex: 1; }
    .account-name { font-size: 14px; font-weight: 600; }
    .account-username { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
    <p style="color: var(--text-muted);">Загрузка PingUp...</p>
  </div>

  <div id="banned-screen" class="banned-screen hidden">
    <div class="banned-card">
      <div class="banned-icon">🚫</div>
      <h2 class="banned-title">Аккаунт заблокирован</h2>
      <p class="banned-text">Ваш аккаунт был заблокирован администрацией PingUp.</p>
      <button class="btn btn-ghost" id="banned-logout-btn">Выйти</button>
    </div>
  </div>

  <div id="login-screen" class="hidden">
    <div class="login-card">
      <div class="login-logo">💬</div>
      <h1 class="login-title">PingUp</h1>
      <p class="login-subtitle">Современный мессенджер</p>
      
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="login-name" class="form-input" placeholder="Ваше имя" maxlength="30" />
      </div>
      
      <div class="form-group">
        <label>Юзернейм</label>
        <input type="text" id="login-username" class="form-input" placeholder="username" maxlength="20" />
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" class="form-input" placeholder="Пароль (необязательно)" />
      </div>

      <div id="login-error" class="form-error"></div>
      
      <button id="btn-login" class="btn btn-primary" style="width: 100%;">Войти</button>
      
      <div id="saved-accounts" class="accounts-list hidden"></div>
      
      <p class="form-hint" style="margin-top:16px;text-align:center;">Максимум 3 аккаунта на устройство</p>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">💬 <span>PingUp</span></div>
        <div class="user-menu">
          <div class="user-avatar-btn" id="my-profile-btn" title="Профиль"></div>
          <button class="btn-icon" id="btn-favorites" title="Избранное">⭐</button>
          <button class="btn-icon" id="btn-settings" title="Настройки">⚙️</button>
        </div>
      </div>

      <div class="sidebar-search">
        <div class="search-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="search-input" placeholder="Поиск @username..." />
        </div>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-ghost btn-sm" id="btn-create-group">➕ Группа</button>
        <button class="btn btn-ghost btn-sm" id="btn-create-channel">📢 Канал</button>
      </div>

      <div id="search-results" class="search-results hidden"></div>
      <div class="chat-list" id="chat-list"></div>
    </aside>

    <main class="chat-area">
      <div class="chat-placeholder" id="chat-placeholder">
        <div class="chat-placeholder-icon">💬</div>
        <h3>Выберите чат</h3>
        <p style="color:var(--text-muted);">Найдите собеседника или создайте группу</p>
      </div>

      <div id="active-chat" class="hidden" style="display:flex;flex-direction:column;height:100%;position:relative;">
        <div class="chat-header">
          <button class="btn-icon btn-back-mobile" id="btn-back-mobile">←</button>
          <div class="chat-header-avatar" id="chat-avatar">💬</div>
          <div class="chat-header-info" id="chat-header-info">
            <div class="chat-header-name" id="chat-name">Чат</div>
            <div class="chat-header-status" id="chat-status"></div>
          </div>
          <div class="chat-header-actions">
            <button class="btn-icon" id="btn-chat-menu" title="Меню">⋮</button>
          </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div id="sticker-panel" class="sticker-panel hidden"></div>

        <div id="message-input-area">
          <div class="message-input-bar" id="message-input-bar">
            <div id="attachments-preview" class="attachments-preview hidden"></div>
            <div id="edit-indicator" class="hidden" style="padding:8px;background:var(--accent-light);border-radius:var(--radius-sm);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:12px;">✏️ Редактирование сообщения</span>
              <button class="btn-icon" id="cancel-edit" style="width:24px;height:24px;font-size:12px;">✕</button>
            </div>
            <div class="message-input-wrapper">
              <div class="input-actions">
                <button class="btn-icon" id="btn-attach-file" title="Файл">📎</button>
                <button class="btn-icon" id="btn-attach-image" title="Фото">🖼️</button>
                <button class="btn-icon" id="btn-stickers" title="Стикеры">😊</button>
              </div>
              <textarea class="message-input" id="message-input" placeholder="Сообщение..." rows="1"></textarea>
              <button class="btn-icon" id="btn-voice" title="Голосовое">🎤</button>
              <button class="btn-send" id="btn-send" title="Отправить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
          <div class="input-blocked-msg hidden" id="input-blocked-msg"></div>
        </div>
      </div>
    </main>
  </div>

  <input type="file" id="file-input" class="file-input-hidden" />
  <input type="file" id="image-input" class="file-input-hidden" accept="image/*" />
  <input type="file" id="avatar-input" class="file-input-hidden" accept="image/*" />
  <input type="file" id="sticker-input" class="file-input-hidden" accept="image/*" />

  <div id="modal-root"></div>
  <div id="context-menu-root"></div>
  <div class="toast-container" id="toast-container"></div>
  <div id="image-viewer-root"></div>

  <script type="module" src="app.js"></script>
</body>
  </html>
